org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Classic Android DSL plus the Kotlin Android plugin. AGP 9 enables the new DSL
# and built-in Kotlin by default; both are opted out so ktlint, detekt and Hilt
# keep using the stable plugin surface. Built-in Kotlin returns in AGP 10.
android.newDsl=false
android.builtInKotlin=false
kotlin.code.style=official
android.uniquePackageNames=false
